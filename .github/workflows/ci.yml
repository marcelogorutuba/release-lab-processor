name: Tests

# Called by pipeline.yml. pytest runs the whole tests/ tree (unit and integration); the
# only tests left out are the ones in tests/ci_exclusions.txt, each with an owner and a
# reason. The suite needs the runtime deps because src/services/__init__ imports eagerly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q -rs --junitxml=pytest-report.xml
